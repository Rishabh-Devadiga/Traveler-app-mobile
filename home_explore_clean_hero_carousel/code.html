  transition: opacity 1.8s ease-in-out;

.carousel-slide.active {
  opacity: 1;
}
@media (prefers-reduced-motion: reduce) {
  .carousel-slide {

  }
  .carousel-slide:not(:first-child) {

  }

<script>
  // Dynamic Rotating Background Carousel System
  (function initBackgroundCarousel() {
    const slides = [
      document.getElementById('slide-0'),
      document.getElementById('slide-1'),
      document.getElementById('slide-2'),
      document.getElementById('slide-3'),
      document.getElementById('slide-4'),
      document.getElementById('slide-5'),
      document.getElementById('slide-6'),
      document.getElementById('slide-7')
    ];

    let currentIndex = 0;
    let timer = null;
    const DISPLAY_DURATION = 7000; // 7 seconds visibility

    // Check user reduced motion preference
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setSlide(index) {
      if (!slides[index]) return;

      // Update Slides opacity via class
      slides.forEach((slide, i) => {
        if (!slide) return;
        if (i === index) {
          slide.classList.add('active');
        } else {
          slide.classList.remove('active');
        }
      });

      currentIndex = index;
    }

    function nextSlide() {
      const next = (currentIndex + 1) % slides.length;
      setSlide(next);
    }

    if (!prefersReducedMotion) {
      timer = setInterval(nextSlide, DISPLAY_DURATION);
    }

    // Micro-interaction: tactile feedback on start button
    const startBtn = document.getElementById('start-journey-btn');
    if (startBtn) {
      startBtn.addEventListener('click', () => {
        startBtn.classList.add('scale-95');
        setTimeout(() => {
          startBtn.classList.remove('scale-95');
        }, 150);
      });
    }
  })();
