<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
<!-- Capacitor WebView + desktop dev: allow the configured backend while
      keeping the page itself XSS-locked. CSP matches scheme+host+port, so
      'self' (the page on :5173) never covers an API on :8000; every backend
      host this app can resolve MUST be listed below in BOTH connect-src
      (fetch/JSON) and img-src (backend avatar <img>):
        http://127.0.0.1:8000        .env VITE_TOURFLOW_API_URL (desktop dev)
        http://localhost:8000        shipped public/api-config.json default
        http://192.168.137.100:8000  .env.production LAN backend for the APK
      Missing them the browser refuses the call ("Refused to connect to ..."
      / "violates the ... connect-src directive") and the UI only shows
      status 0. https: keeps fonts/maps working on web. Without connect-src
      http: the APK's fetch() to the HTTP backend is blocked as a CSP violation
      (in addition to Android cleartext policy). vite.config.ts also injects the
      VITE_TOURFLOW_API_URL origin here at dev/build time, so pointing the app at
      another backend host needs no edit. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http://127.0.0.1:8000 http://localhost:8000 http://192.168.137.100:8000 https:; connect-src 'self' http://127.0.0.1:8000 http://localhost:8000 http://192.168.137.100:8000 https: wss: blob:; media-src 'self' data: blob: https:; frame-src 'self' blob:;"
    />
    <title>WanderAI — Traveler</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23F05A28'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3ET%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cabinet+Grotesk:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
