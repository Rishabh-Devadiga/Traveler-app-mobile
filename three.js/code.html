<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_19 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_19" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_19');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D Earth Globe with canvas procedural texture, atmosphere glow, and markers
(function() {
  const container = document.getElementById('threejs-globe-canvas') || document.getElementById('globe-container') || document.body;
  const width = container.clientWidth || 360;
  const height = container.clientHeight || 240;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
  camera.position.z = 2.7;

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  // Generate Canvas Earth Texture (Stylized WanderAI Green/Ocean Earth)
  const texCanvas = document.createElement('canvas');
  texCanvas.width = 1024;
  texCanvas.height = 512;
  const ctx = texCanvas.getContext('2d');

  // Deep serene ocean gradient
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, 512);
  oceanGrad.addColorStop(0, '#10393b');
  oceanGrad.addColorStop(0.5, '#184e52');
  oceanGrad.addColorStop(1, '#0e3133');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, 1024, 512);

  // Soft latitude/longitude grid lines
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
  ctx.lineWidth = 1;
  for (let lat = 40; lat < 512; lat += 50) {
    ctx.beginPath();
    ctx.moveTo(0, lat);
    ctx.lineTo(1024, lat);
    ctx.stroke();
  }
  for (let lon = 50; lon < 1024; lon += 80) {
    ctx.beginPath();
    ctx.moveTo(lon, 0);
    ctx.lineTo(lon, 512);
    ctx.stroke();
  }

  // Draw land masses in warm natural WanderAI olive/emerald green tones
  ctx.fillStyle = '#4ade80';
  ctx.shadowColor = 'rgba(74, 222, 128, 0.3)';
  ctx.shadowBlur = 4;

  function drawContinent(points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i][0], points[i][1]);
    }
    ctx.closePath();
    ctx.fill();
  }

  // India & South Asia
  ctx.fillStyle = '#86efac';
  drawContinent([
    [690, 180], [730, 185], [745, 230], [715, 285], [700, 260], [680, 220], [675, 195]
  ]);
  // Eurasia
  ctx.fillStyle = '#34d399';
  drawContinent([
    [520, 120], [600, 100], [700, 110], [820, 140], [860, 200], [780, 220], [720, 170], [640, 160], [560, 170], [510, 150]
  ]);
  // Africa
  ctx.fillStyle = '#6ee7b7';
  drawContinent([
    [510, 180], [580, 190], [610, 250], [570, 340], [530, 360], [490, 280], [480, 210]
  ]);
  // Southeast Asia / Japan
  drawContinent([
    [780, 230], [830, 250], [820, 290], [770, 280]
  ]);
  // Americas preview
  drawContinent([
    [220, 120], [320, 130], [280, 220], [240, 220], [200, 160]
  ]);
  drawContinent([
    [270, 240], [340, 280], [320, 390], [280, 420], [260, 320]
  ]);

  const earthTexture = new THREE.CanvasTexture(texCanvas);

  // Earth Sphere
  const globeGeo = new THREE.SphereGeometry(1, 48, 48);
  const globeMat = new THREE.MeshPhongMaterial({
    map: earthTexture,
    shininess: 18,
    specular: new THREE.Color(0x38bdf8),
    emissive: new THREE.Color(0x062024),
  });
  const globeMesh = new THREE.Mesh(globeGeo, globeMat);
  scene.add(globeMesh);

  // Atmosphere Outer Glow
  const glowGeo = new THREE.SphereGeometry(1.04, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x38bdf8,
    transparent: true,
    opacity: 0.18,
    side: THREE.BackSide
  });
  const glowMesh = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glowMesh);

  // Subtle clouds halo
  const cloudGeo = new THREE.SphereGeometry(1.015, 32, 32);
  const cloudMat = new THREE.MeshLambertMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.14
  });
  const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
  scene.add(cloudMesh);

  // Add Glowing Destination Markers (e.g. India / Udaipur, Alps, Tokyo, Bali)
  function latLonToVector3(lat, lon, radius) {
    const phi = (90 - lat) * (Math.PI / 180);
    const theta = (lon + 180) * (Math.PI / 180);
    const x = -(radius * Math.sin(phi) * Math.cos(theta));
    const z = (radius * Math.sin(phi) * Math.sin(theta));
    const y = (radius * Math.cos(phi));
    return new THREE.Vector3(x, y, z);
  }

  const markersGroup = new THREE.Group();
  const destinations = [
    { name: 'India', lat: 24.58, lon: 73.71, color: 0xff6b35, pulse: true }, // Udaipur / Rajasthan
    { name: 'Japan', lat: 35.67, lon: 139.65, color: 0x38bdf8, pulse: false },
    { name: 'Europe', lat: 46.8, lon: 9.8, color: 0x34d399, pulse: false },
    { name: 'Bali', lat: -8.4, lon: 115.18, color: 0xfbbf24, pulse: false }
  ];

  destinations.forEach(d => {
    const pos = latLonToVector3(d.lat, d.lon, 1.02);
    const dotGeo = new THREE.SphereGeometry(0.045, 16, 16);
    const dotMat = new THREE.MeshBasicMaterial({ color: d.color });
    const dot = new THREE.Mesh(dotGeo, dotMat);
    dot.position.copy(pos);

    // Pulse ring for primary selected
    const ringGeo = new THREE.RingGeometry(0.05, 0.08, 24);
    const ringMat = new THREE.MeshBasicMaterial({ color: d.color, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(pos);
    ring.lookAt(new THREE.Vector3(0, 0, 0));
    ring.scale.set(1.2, 1.2, 1.2);

    markersGroup.add(dot);
    markersGroup.add(ring);
  });
  globeMesh.add(markersGroup);

  // Lighting
  const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
  scene.add(ambientLight);

  const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
  sunLight.position.set(3, 2, 4);
  scene.add(sunLight);

  // Initial tilt toward India
  globeMesh.rotation.x = 0.35;
  globeMesh.rotation.y = -1.2;

  // Interaction / Drag rotation
  let isDragging = false;
  let prevMouseX = 0;
  let prevMouseY = 0;

  container.addEventListener('pointerdown', (e) => {
    isDragging = true;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  });

  window.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const deltaX = e.clientX - prevMouseX;
    const deltaY = e.clientY - prevMouseY;
    globeMesh.rotation.y += deltaX * 0.008;
    globeMesh.rotation.x += deltaY * 0.008;
    prevMouseX = e.clientX;
    prevMouseY = e.clientY;
  });

  window.addEventListener('pointerup', () => { isDragging = false; });

  // Animation loop
  function animate() {
    requestAnimationFrame(animate);
    if (!isDragging) {
      globeMesh.rotation.y += 0.0025; // Gentle auto-rotation
      cloudMesh.rotation.y += 0.0032;
    }
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const w = container.clientWidth || 360;
    const h = container.clientHeight || 240;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
})();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_19 -->
</body>
</html>
